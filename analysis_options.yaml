# App analysis rules; use `flutter analyze` from the repository root.
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # The native plugin and its example have separate package dependencies.
    - native/**
    - build/**
    - android/**

linter:
  rules:
    # Catch unobserved futures, resource leaks, and unchecked dynamic calls.
    - unawaited_futures
    - discarded_futures
    - cancel_subscriptions
    - close_sinks
    - avoid_dynamic_calls
    - prefer_final_locals
    - prefer_final_in_for_each
