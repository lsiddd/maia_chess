// Build adapter for the pinned stockfish 1.8.1 package. Its Java/C++ sources,
// bundled networks and license remain supplied by pub; only the obsolete
// JCenter/AGP 3.5 build script is replaced. Do not edit the pub cache.
apply plugin: 'com.android.library'

android {
    namespace 'com.arjanaswal.stockfish'
    compileSdk 36
    ndkVersion '28.2.13676358'
    defaultConfig {
        minSdk 24
        ndk { abiFilters project.findProperty('target-platform') == 'android-x64' ? 'x86_64' : 'arm64-v8a' }
        externalNativeBuild {
            cmake { cppFlags '-std=c++17' }
        }
    }
    externalNativeBuild {
        cmake { path new File(projectDir, 'CMakeLists.txt') }
    }
}
