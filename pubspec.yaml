name: maia_chess
description: "Offline chess against human-style Maia opponents via lc0, with Stockfish hints and local game history."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.3.0
  # Chess rules, legal moves, and FEN/SAN notation.
  dartchess: ^0.13.1
  # Local fork with generated protobuf headers and private UCI pipes for
  # coexistence with Stockfish. See native/leela_chess_zero/architecture.md.
  leela_chess_zero:
    path: native/leela_chess_zero
  stockfish: ^1.8.1
  path_provider: ^2.1.6
  path: ^1.9.1
  drift: ^2.34.3
  share_plus: ^12.0.2
  file_picker: ^11.0.3
  uuid: ^4.6.0
  wakelock_plus: ^1.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Nine official Maia networks (1100–1900). Provenance and licensing are
  # recorded in assets/maia_weights/NOTICE.md.
  assets:
    - assets/chess_pieces/
    - assets/chess_boards/
    - assets/maia_weights/maia-1100.pb.gz
    - assets/maia_weights/maia-1200.pb.gz
    - assets/maia_weights/maia-1300.pb.gz
    - assets/maia_weights/maia-1400.pb.gz
    - assets/maia_weights/maia-1500.pb.gz
    - assets/maia_weights/maia-1600.pb.gz
    - assets/maia_weights/maia-1700.pb.gz
    - assets/maia_weights/maia-1800.pb.gz
    - assets/maia_weights/maia-1900.pb.gz
