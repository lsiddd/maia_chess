name: maia_chess
description: "Offline chess against human-style Maia opponents via Maia-3 79M, with Stockfish hints and local game history."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  flutter_svg: ^2.3.0
  # Chess rules, legal moves, and FEN/SAN notation.
  dartchess: ^0.13.1
  stockfish: 1.8.1
  path_provider: ^2.1.6
  path: ^1.9.1
  drift: ^2.34.3
  share_plus: ^13.3.1
  file_picker: ^13.3.2
  uuid: ^4.6.0
  wakelock_plus: ^1.8.2
  onnxruntime_plus: 1.5.0
  crypto: ^3.0.6
  archive: ^4.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.34.0
  build_runner: ^2.15.1

flutter:
  uses-material-design: true

  # Maia-3 79M FP32 is versioned in Git LFS; no conversion step at build time.
  assets:
    - assets/chess_pieces/
    - assets/chess_boards/
    - assets/maia3/
