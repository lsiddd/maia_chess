name: CI

# Checks for pull requests and release builds. Android integration tests
# require an emulator or device and are run separately; see CONTRIBUTING.md.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing vX.Y.Z tag to publish; leave empty for an artifact only'
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze, format, and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.sha }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: SDK versions
        run: flutter --version

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      # Match the app analyzer scope; the native plugin is a separate package.
      - name: dart format (app code only)
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver

      - name: flutter test
        run: flutter test --coverage

      - name: Test release tools
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  apk:
    name: ARM64 release APK
    needs: analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
      source_sha: ${{ steps.version.outputs.source_sha }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.sha }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Prepare SDK and limit Gradle memory
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF
      - name: Install dependencies
        run: flutter pub get
      - name: Set version
        id: version
        env:
          REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use a vX.Y.Z tag'; exit 1; }
            version="${REF_NAME#v}"
          else
            version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ github.ref_type == 'tag' || inputs.release_tag != '' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}
          SIGNING_REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
        run: GITHUB_REF_TYPE="$SIGNING_REF_TYPE" python3 scripts/configure_android_signing.py
      - name: Build release APK
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Verify APK signature and contents
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          python3 scripts/verify_apk.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Prepare distribution files
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/maia-chess-$APP_VERSION-arm64-v8a.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: android-release
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remove signing material
        if: always()
        run: rm -f android/app/key.properties android/app/ci-release.jks

  nightly:
    name: Publish nightly
    needs: apk
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-nightly
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v7
        with:
          name: android-release
          path: dist
      - name: Update nightly tag, APK, and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          APP_VERSION: ${{ needs.apk.outputs.version }}
        run: |
          # An older build finishing after another push must not replace
          # the nightly for the latest main commit.
          latest_sha="$(gh api "repos/$GH_REPO/commits/main" --jq .sha)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo '::notice::A newer commit is on main; this nightly has been superseded.'
            exit 0
          fi

          cd dist
          sha256sum --check SHA256SUMS
          mv "maia-chess-$APP_VERSION-arm64-v8a.apk" maia-chess-nightly-arm64-v8a.apk
          sha256sum maia-chess-nightly-arm64-v8a.apk > SHA256SUMS
          notes_file="$RUNNER_TEMP/nightly-notes.md"
          cat > "$notes_file" <<EOF
          Automated development build from the main branch.

          - Commit: [$GITHUB_SHA]($GITHUB_SERVER_URL/$GH_REPO/commit/$GITHUB_SHA)
          - Version: $APP_VERSION (build $GITHUB_RUN_NUMBER)
          - CI: [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)

          ARM64 APK signed with the release key. Verify SHA256SUMS before installing.
          This pre-release is updated after each main push that passes the checks.
          EOF

          git tag --force nightly "$GITHUB_SHA"
          git push --force origin refs/tags/nightly
          if gh release view nightly > /dev/null 2>&1; then
            gh release upload nightly maia-chess-nightly-arm64-v8a.apk SHA256SUMS --clobber
            gh release edit nightly --title 'Maia Chess Nightly' --notes-file "$notes_file" --prerelease --latest=false
          else
            gh release create nightly maia-chess-nightly-arm64-v8a.apk SHA256SUMS --verify-tag --title 'Maia Chess Nightly' --notes-file "$notes_file" --prerelease --latest=false
          fi

  release:
    name: Publish GitHub Release
    needs: apk
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android-release
          path: dist
      - name: Publish APK and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          SOURCE_SHA: ${{ needs.apk.outputs.source_sha }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          notes_file="$RUNNER_TEMP/release-notes.md"
          cat > "$notes_file" <<EOF
          Maia Chess Android release $RELEASE_TAG.

          - Source: [$SOURCE_SHA]($GITHUB_SERVER_URL/$GH_REPO/commit/$SOURCE_SHA)
          - CI: [run $GITHUB_RUN_NUMBER]($GITHUB_SERVER_URL/$GH_REPO/actions/runs/$GITHUB_RUN_ID)

          ARM64 APK signed with the release key, for Android 7.0/API 24 or later.
          Verify SHA256SUMS before installing. Game data is stored locally.
          EOF
          gh release create "$RELEASE_TAG" ./*.apk SHA256SUMS --verify-tag --title "Maia Chess $RELEASE_TAG" --notes-file "$notes_file"
