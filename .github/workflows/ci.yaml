name: CI

# Gate mínimo antes de merge (ver AUDITORIA_TECNICA.md, AUD-002): análise
# estática, formatação e testes unitários/widget. `integration_test/`
# depende de emulador/dispositivo Android e fica fora deste gate por ora
# (ver AUD-002 e AUD-015 no relatório de auditoria).

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tag vX.Y.Z existente para publicar; vazio gera apenas artefato'
        required: false
        type: string

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze, format e testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: "stable"
          cache: true

      - name: Instalar dependências
        run: flutter pub get

      - name: Versões do SDK
        run: flutter --version

      - name: flutter analyze
        run: flutter analyze --no-fatal-infos

      # Restrito a lib/test/integration_test: native/ é um pacote de
      # terceiros vendorizado (ver ADR-001) e não passa por este gate,
      # assim como já é excluído do analyzer em analysis_options.yaml.
      - name: dart format (somente código do app)
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: flutter test
        run: flutter test --coverage

      - name: Testar ferramentas de release
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Publicar cobertura como artefato
        uses: actions/upload-artifact@v6
        with:
          name: coverage-lcov
          path: coverage/lcov.info

  apk:
    name: APK release ARM64
    needs: analyze
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_tag || github.ref }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Preparar SDK e limitar memória do Gradle
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
          mkdir -p "$HOME/.gradle"
          cat > "$HOME/.gradle/gradle.properties" <<'EOF'
          org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
          org.gradle.workers.max=2
          org.gradle.parallel=false
          EOF
      - name: Instalar dependências
        run: flutter pub get
      - name: Definir versão
        id: version
        env:
          REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.release_tag || github.ref_name }}
        run: |
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use uma tag vX.Y.Z'; exit 1; }
            version="${REF_NAME#v}"
          else
            version="$(sed -n 's/^version: \([^+]*\).*/\1/p' pubspec.yaml)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Configurar assinatura
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REQUIRE_RELEASE_SIGNING: ${{ github.ref_type == 'tag' || inputs.release_tag != '' }}
          SIGNING_REF_TYPE: ${{ inputs.release_tag && 'tag' || github.ref_type }}
        run: GITHUB_REF_TYPE="$SIGNING_REF_TYPE" python3 scripts/configure_android_signing.py
      - name: Gerar APK release
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: flutter build apk --release --split-per-abi --target-platform android-arm64 --build-name "$APP_VERSION" --build-number "$GITHUB_RUN_NUMBER"
      - name: Verificar assinatura e conteúdo do APK
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          python3 scripts/verify_apk.py build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Preparar arquivos de distribuição
        env:
          APP_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "dist/maia-chess-$APP_VERSION-arm64-v8a.apk"
          cd dist
          sha256sum ./*.apk > SHA256SUMS
      - uses: actions/upload-artifact@v6
        with:
          name: android-release
          path: dist/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Remover material de assinatura
        if: always()
        run: rm -f android/app/key.properties android/app/ci-release.jks

  release:
    name: Publicar GitHub Release
    needs: apk
    if: github.ref_type == 'tag' || inputs.release_tag != ''
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    concurrency:
      group: release-${{ inputs.release_tag || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: android-release
          path: dist
      - name: Publicar APK e checksum
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./*.apk SHA256SUMS --verify-tag --title "Xadrez Maia $RELEASE_TAG" --generate-notes
